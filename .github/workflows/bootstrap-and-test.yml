name: Bootstrap and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply staged v0.10 interaction fix
        if: ${{ hashFiles('.v10/apply.py') != '' }}
        run: python .v10/apply.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run tests
        run: npm test
      - name: Run bot simulation
        run: node test/simulate.mjs
      - name: Install Playwright for Light Cavalry interaction regression
        if: ${{ hashFiles('.v10/light-cavalry.mjs') != '' }}
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Verify Light Cavalry two-step battlefield interaction
        if: ${{ hashFiles('.v10/light-cavalry.mjs') != '' }}
        run: |
          python3 -m http.server 4173 > /tmp/war-chest-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node .v10/light-cavalry.mjs
      - name: Commit v0.10 source and build output
        if: ${{ hashFiles('.v10/apply.py') != '' }}
        run: |
          rm -rf .v10
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make Light Cavalry two-step Tactic clickable v0.10'
          git push
