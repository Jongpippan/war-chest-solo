name: Bootstrap and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply staged v0.5 icon and diagram patch
        if: ${{ hashFiles('.v05/apply.py') != '' }}
        run: python .v05/apply.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run tests
        run: npm test
      - name: Run bot simulation
        run: node test/simulate.mjs
      - name: Commit v0.5 source and build output
        if: ${{ hashFiles('.v05/apply.py') != '' }}
        run: |
          rm -rf .v05
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: align unit symbols and tactic diagrams v0.5'
          git push
