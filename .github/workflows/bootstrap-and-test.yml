name: Bootstrap and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply staged v0.4 UI patch
        if: ${{ hashFiles('.v04/ui.patch.gz.b64') != '' }}
        run: |
          base64 -d .v04/ui.patch.gz.b64 | gunzip > /tmp/v04.patch
          git apply /tmp/v04.patch
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run tests
        run: npm test
      - name: Run bot simulation
        run: node test/simulate.mjs
      - name: Commit v0.4 source and build output
        if: ${{ hashFiles('.v04/ui.patch.gz.b64') != '' }}
        run: |
          rm -rf .v04
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: card-style unit hover and setup CTA fixes v0.4'
          git push
