name: Bootstrap and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Run unit and engine tests
        run: npm test

      - name: Run bot simulation
        run: node test/simulate.mjs

      - name: Install mobile browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run mobile interaction regression
        run: |
          python3 -m http.server 4173 > /tmp/war-chest-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node test/mobile-ui.mjs
