name: Bootstrap and test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply staged v0.6 tabletop UI patch
        if: ${{ hashFiles('.v06/apply_v06.py.gz.b64') != '' }}
        run: |
          base64 -d .v06/apply_v06.py.gz.b64 | gunzip > /tmp/apply_v06.py
          python /tmp/apply_v06.py
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: Run tests
        run: npm test
      - name: Run bot simulation
        run: node test/simulate.mjs
      - name: Commit v0.6 source and build output
        if: ${{ hashFiles('.v06/apply_v06.py.gz.b64') != '' }}
        run: |
          rm -rf .v06
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: tabletop player areas and compact game layout v0.6'
          git push
